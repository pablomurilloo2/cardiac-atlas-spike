<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudio espacial — diagrama · corte · 3D</title>

<style>
  :root {
    --ink: #111827; --mut: #6B7280; --faint: #9CA3AF;
    --line: #E5E7EB; --panel: rgba(255,255,255,0.94); --accent: #2563EB;
    --mono: ui-monospace, Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #FAFAFB; color: var(--ink); font-family: var(--sans);
         font-size: 13px; overflow: hidden; }
  .hdr { position: fixed; top: 18px; left: 24px; z-index: 5; pointer-events: none; }
  .eyebrow { font-family: var(--mono); font-size: 9.5px; text-transform: uppercase;
             letter-spacing: 0.14em; color: var(--faint); }
  .hdr h1 { margin: 3px 0 2px; font-size: 18px; font-weight: 650; letter-spacing: -0.02em; }
  .hdr .meta { font-size: 11px; color: var(--mut); }
  .hdr .meta a { color: var(--mut); pointer-events: auto; }

  .cols { display: grid; grid-template-columns: 220px 1fr 340px; height: 100dvh; padding-top: 76px; gap: 0; }
  @media (max-width: 900px) { .cols { grid-template-columns: 150px 1fr; }
    .axial { position: fixed; right: 10px; bottom: 10px; width: 200px !important; height: 200px !important;
             border-radius: 12px; border: 1px solid var(--line); } }

  /* ---- panel diagrama ---- */
  .diagram { border-right: 1px solid var(--line); background: #fff; padding: 10px 8px; overflow-y: auto; }
  .diagram .cap { font-family: var(--mono); font-size: 9.5px; text-transform: uppercase;
                  letter-spacing: 0.1em; color: var(--faint); text-align: center; margin-bottom: 6px; }
  .diagram svg { width: 100%; display: block; }
  .diagram .lvl { cursor: pointer; }
  .diagram .lvl rect, .diagram .lvl ellipse, .diagram .lvl path { transition: fill 140ms ease; }
  .diagram .lvl text { font-family: var(--mono); font-size: 7px; fill: var(--mut); pointer-events: none; }
  .diagram .lvl.on rect, .diagram .lvl.on ellipse, .diagram .lvl.on path { fill: #2563EB !important; }
  .diagram .lvl.on text { fill: #fff; font-weight: 700; }

  /* ---- 3D ---- */
  .three { position: relative; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  .readout { position: absolute; left: 14px; bottom: 14px; max-width: 480px;
    font-family: var(--mono); font-size: 11px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px;
    box-shadow: 0 6px 22px rgba(17,24,39,0.06); pointer-events: none; }
  .hint { position: absolute; right: 14px; top: 8px; font-family: var(--mono);
          font-size: 9.5px; color: var(--faint); pointer-events: none; }

  /* ---- panel axial ---- */
  .axial { border-left: 1px solid var(--line); background: #0B0D12; position: relative;
           display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .axial img, .axial svg { max-width: 100%; max-height: 100%; }
  .axial .cap { position: absolute; top: 8px; left: 10px; right: 10px;
    font-family: var(--mono); font-size: 9.5px; color: #9CA3AF; display: flex; }
  .axial .cap b { color: #E5E7EB; }
  .axial .cap span:last-child { margin-left: auto; }
  .axial .foot { position: absolute; bottom: 8px; left: 10px; right: 10px;
    font-family: var(--mono); font-size: 9px; color: #6B7280; }
  .loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
             font-family: var(--mono); font-size: 12px; color: var(--faint); background: #FAFAFB; z-index: 9; }
</style>

<header class="hdr">
  <div class="eyebrow">Proyecto 04 · fuente: x.com/ZentrixHQ/status/2097579544366534955</div>
  <h1>Estudio espacial — columna lumbar</h1>
  <div class="meta">diagrama ⇄ 3D ⇄ corte axial, siempre sincronizados · <a href="../">← proyectos</a></div>
</header>

<div class="cols">
  <aside class="diagram">
    <div class="cap">Diagrama — vista lateral</div>
    <svg id="diag" viewBox="0 0 100 300" aria-label="Esquema lateral de la columna lumbar"></svg>
  </aside>

  <main class="three">
    <canvas id="gl"></canvas>
    <div class="hint">rueda: nivel · arrastra: rotar · los tres paneles se mueven juntos</div>
    <div class="readout" id="readout">…</div>
  </main>

  <aside class="axial">
    <div class="cap"><span>Corte axial — <b id="axLvl">…</b></span><span id="axSrc">…</span></div>
    <div id="axHost"></div>
    <div class="foot" id="axFoot"></div>
  </aside>
</div>
<div class="loading" id="loading">preparando el estudio…</div>

<script type="module">
import * as THREE from '../../vendor/three.module.min.js';

/* ---------- niveles del estudio (de arriba a abajo) ---------- */
const LEVELS = [
  { id: 'L1',  tipo: 'vertebra', match: 'first lumbar vertebra',  not: 'disk' },
  { id: 'L1-L2', tipo: 'disco',  match: 'disk of first lumbar' },
  { id: 'L2',  tipo: 'vertebra', match: 'second lumbar vertebra', not: 'disk' },
  { id: 'L2-L3', tipo: 'disco',  match: 'disk of second lumbar' },
  { id: 'L3',  tipo: 'vertebra', match: 'third lumbar vertebra',  not: 'disk' },
  { id: 'L3-L4', tipo: 'disco',  match: 'disk of third lumbar' },
  { id: 'L4',  tipo: 'vertebra', match: 'fourth lumbar vertebra', not: 'disk' },
  { id: 'L4-L5', tipo: 'disco',  match: 'disk of fourth lumbar' },
  { id: 'L5',  tipo: 'vertebra', match: 'fifth lumbar vertebra',  not: 'disk' },
  { id: 'L5-S1', tipo: 'disco',  match: 'disk of fifth lumbar' },
  { id: 'Sacro', tipo: 'hueso',  match: 'sacrum' },
];
const NOTAS = {
  'L5-S1': 'El nivel más cargado de la columna: soporta el peso de todo el tronco. El sitio más común de protrusión discal.',
  'L4-L5': 'Segundo nivel más móvil y más propenso a hernia.',
  Sacro: 'Cinco vértebras fusionadas; transmite la carga a la pelvis.',
};

const $ = (id) => document.getElementById(id);

/* ---------- cargar anatomía y filtrar la columna lumbar ---------- */
const manifest = await fetch('../../anatomy-full.json').then((r) => r.json());
const bin = await fetch('../../anatomy-full.bin').then((r) => r.arrayBuffer());

const renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: true });
renderer.setClearColor(0xFAFAFB, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, 1, 0.005, 10);
const key = new THREE.DirectionalLight(0xfff4ec, 1.6); key.position.set(3, 4, 3);
const rim = new THREE.DirectionalLight(0xdfe8ff, 0.7); rim.position.set(-4, 1, -3);
scene.add(key, rim, new THREE.HemisphereLight(0xffffff, 0x8a8f9e, 0.9), new THREE.AmbientLight(0xffffff, 0.3));
const root = new THREE.Group(); scene.add(root);

const meshes = [];
const byLevel = new Map();
const bbox = new THREE.Box3();
for (const p of manifest.parts) {
  const n = p.name.toLowerCase();
  const lvl = LEVELS.find((L) => n.includes(L.match) && (!L.not || !n.includes(L.not)));
  if (!lvl) continue;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(bin, p.positions, p.vertexCount * 3), 3));
  g.setAttribute('normal', new THREE.BufferAttribute(new Int16Array(bin, p.normals, p.vertexCount * 3), 3, true));
  g.setIndex(new THREE.BufferAttribute(new Uint32Array(bin, p.indices, p.indexCount), 1));
  g.computeBoundingSphere();
  const col = lvl.tipo === 'disco' ? '#D9A05E' : '#E6E0D2';
  const mat = new THREE.MeshPhysicalMaterial({ color: new THREE.Color(col),
    roughness: 0.55, metalness: 0.02, clearcoat: 0.3 });
  const mesh = new THREE.Mesh(g, mat);
  mesh.userData = { part: p, lvl: lvl.id, baseColor: mat.color.clone() };
  root.add(mesh); meshes.push(mesh);
  (byLevel.get(lvl.id) ?? byLevel.set(lvl.id, []).get(lvl.id)).push(mesh);
  bbox.expandByObject(mesh);
}
const center = bbox.getCenter(new THREE.Vector3());
root.position.sub(center);
const radius = bbox.getSize(new THREE.Vector3()).length() / 2;

/* alturas por nivel (para el plano y el mapeo de cortes) */
const levelY = new Map();
for (const L of LEVELS) {
  const arr = byLevel.get(L.id) || [];
  if (!arr.length) continue;
  let y = 0; for (const m of arr) y += m.geometry.boundingSphere.center.y;
  levelY.set(L.id, y / arr.length - center.y);
}
const yTop = Math.max(...levelY.values()), yBot = Math.min(...levelY.values());

/* plano de corte visible en el 3D */
const plane = new THREE.Mesh(
  new THREE.PlaneGeometry(0.24, 0.24),
  new THREE.MeshBasicMaterial({ color: 0x2563EB, transparent: true, opacity: 0.14,
    side: THREE.DoubleSide, depthWrite: false }));
plane.rotation.x = Math.PI / 2;
const planeEdge = new THREE.LineSegments(
  new THREE.EdgesGeometry(plane.geometry),
  new THREE.LineBasicMaterial({ color: 0x2563EB, transparent: true, opacity: 0.7 }));
planeEdge.rotation.x = Math.PI / 2;
scene.add(plane, planeEdge);

/* ---------- cámara ---------- */
const orbit = { az: 0.9, el: 0.1, dist: radius * 2.6, target: new THREE.Vector3() };
const cur = { az: orbit.az, el: orbit.el, dist: orbit.dist, target: orbit.target.clone() };
function applyCamera() {
  const ce = Math.cos(cur.el);
  camera.position.set(
    cur.target.x + cur.dist * ce * Math.sin(cur.az),
    cur.target.y + cur.dist * Math.sin(cur.el),
    cur.target.z + cur.dist * ce * Math.cos(cur.az));
  camera.lookAt(cur.target);
}
function dampCamera(dt) {
  const k = 1 - Math.exp(-dt * 9);
  cur.az += (orbit.az - cur.az) * k; cur.el += (orbit.el - cur.el) * k;
  cur.dist += (orbit.dist - cur.dist) * k; cur.target.lerp(orbit.target, k);
  applyCamera();
}
const canvas = $('gl');
let dragging = false, lastX = 0, lastY = 0;
canvas.addEventListener('pointerdown', (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointerup', (e) => { dragging = false; canvas.releasePointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  orbit.az -= (e.clientX - lastX) * 0.006;
  orbit.el = Math.max(-1.2, Math.min(1.2, orbit.el + (e.clientY - lastY) * 0.006));
  lastX = e.clientX; lastY = e.clientY;
});
canvas.addEventListener('wheel', (e) => { e.preventDefault(); stepLevel(e.deltaY > 0 ? 1 : -1); }, { passive: false });

/* ---------- estudio local (cortes axiales reales) o esquema ---------- */
let axialReal = null;
try {
  const idx = await fetch('../../media/rm-axial/index.json', { cache: 'no-store' })
    .then((r) => r.ok ? r.json() : null);
  if (idx?.files?.length) axialReal = idx.files;
} catch {}
$('axSrc').textContent = axialReal ? 'RM axial local' : 'esquema didáctico';
$('axFoot').textContent = axialReal
  ? 'Estudio personal detectado en este equipo (no forma parte del repo). Mapeo nivel→corte aproximado.'
  : 'Sin estudio local: se muestra el esquema. Con una RM axial en media/rm-axial/ aparecerían los cortes reales.';

function axialSchematic(lvl) {
  const disco = LEVELS.find((L) => L.id === lvl)?.tipo === 'disco';
  return `<svg viewBox="0 0 200 200" width="86%">
    <ellipse cx="100" cy="112" rx="58" ry="44" fill="${disco ? '#C98A4B' : '#D8D2C4'}" stroke="#4B5563"/>
    <circle cx="100" cy="78" r="14" fill="#1F2937" stroke="#6B7280"/>
    <circle cx="100" cy="78" r="9" fill="#E5E7EB" opacity="0.9"/>
    <ellipse cx="64" cy="60" rx="9" ry="16" fill="#B8B2A4" transform="rotate(30 64 60)"/>
    <ellipse cx="136" cy="60" rx="9" ry="16" fill="#B8B2A4" transform="rotate(-30 136 60)"/>
    <rect x="94" y="30" width="12" height="26" rx="5" fill="#B8B2A4"/>
    <text x="100" y="118" text-anchor="middle" font-family="monospace" font-size="13" fill="#111827">${lvl}</text>
    <text x="100" y="190" text-anchor="middle" font-family="monospace" font-size="8" fill="#6B7280">cuerpo ${disco ? 'discal' : 'vertebral'} · canal · apófisis</text>
  </svg>`;
}

/* ---------- diagrama SVG lateral ---------- */
const NS = 'http://www.w3.org/2000/svg';
{
  const svg = $('diag');
  let y = 10;
  for (const L of LEVELS) {
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'lvl'); g.dataset.lvl = L.id;
    if (L.tipo === 'vertebra') {
      const r = document.createElementNS(NS, 'rect');
      r.setAttribute('x', 22); r.setAttribute('y', y); r.setAttribute('width', 46); r.setAttribute('height', 26);
      r.setAttribute('rx', 6); r.setAttribute('fill', '#E6E0D2'); r.setAttribute('stroke', '#B9B2A2');
      const sp = document.createElementNS(NS, 'path');   // apófisis espinosa
      sp.setAttribute('d', `M68 ${y + 8} L86 ${y + 14} L68 ${y + 20} Z`);
      sp.setAttribute('fill', '#D6CFBE');
      g.append(r, sp);
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('x', 45); t.setAttribute('y', y + 17); t.setAttribute('text-anchor', 'middle');
      t.textContent = L.id; g.append(t);
      y += 28;
    } else if (L.tipo === 'disco') {
      const e = document.createElementNS(NS, 'ellipse');
      e.setAttribute('cx', 45); e.setAttribute('cy', y + 5); e.setAttribute('rx', 24); e.setAttribute('ry', 5);
      e.setAttribute('fill', '#D9A05E'); e.setAttribute('stroke', '#B27C3E');
      g.append(e);
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('x', 45); t.setAttribute('y', y + 8); t.setAttribute('text-anchor', 'middle');
      t.textContent = L.id; g.append(t);
      y += 12;
    } else {
      const p = document.createElementNS(NS, 'path');
      p.setAttribute('d', `M25 ${y} L65 ${y} L52 ${y + 40} L38 ${y + 40} Z`);
      p.setAttribute('fill', '#E6E0D2'); p.setAttribute('stroke', '#B9B2A2');
      g.append(p);
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('x', 45); t.setAttribute('y', y + 22); t.setAttribute('text-anchor', 'middle');
      t.textContent = L.id; g.append(t);
      y += 44;
    }
    g.addEventListener('click', () => setLevel(L.id));
    svg.appendChild(g);
  }
  svg.setAttribute('viewBox', `0 0 100 ${y + 6}`);
}

/* ---------- sincronización de los tres paneles ---------- */
let current = 'L5-S1';
function setLevel(id) {
  current = id;
  // diagrama
  document.querySelectorAll('.lvl').forEach((g) => g.classList.toggle('on', g.dataset.lvl === id));
  // 3D: resaltar nivel + mover plano + cámara
  for (const m of meshes) {
    if (m.userData.lvl === id) m.material.color.copy(m.userData.baseColor).offsetHSL(0, 0.25, -0.05).lerp(new THREE.Color(0x2563EB), 0.45);
    else m.material.color.copy(m.userData.baseColor);
  }
  const yy = levelY.get(id) ?? 0;
  plane.position.y = planeEdge.position.y = yy;
  orbit.target.set(0, yy, 0);
  orbit.dist = radius * 1.5;
  // corte
  $('axLvl').textContent = id;
  const host = $('axHost');
  if (axialReal) {
    const t = (yTop - yy) / (yTop - yBot);          // 0 arriba → 1 abajo
    const i = Math.round(t * (axialReal.length - 1));
    host.innerHTML = `<img src="../../media/rm-axial/${axialReal[i]}" alt="corte axial ${id}">`;
  } else {
    host.innerHTML = axialSchematic(id);
  }
  const L = LEVELS.find((x) => x.id === id);
  $('readout').innerHTML = `<b>${id}</b> — ${L.tipo}` +
    (NOTAS[id] ? ` · ${NOTAS[id]}` : '') +
    ` <span style="color:var(--faint)">· rueda para cambiar de nivel</span>`;
}
function stepLevel(d) {
  const i = LEVELS.findIndex((L) => L.id === current);
  const j = Math.max(0, Math.min(LEVELS.length - 1, i + d));
  if (j !== i) setLevel(LEVELS[j].id);
}
addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') stepLevel(1);
  if (e.key === 'ArrowUp') stepLevel(-1);
});

/* ---------- bucle ---------- */
function fit() {
  const r = canvas.parentElement.getBoundingClientRect();
  renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / r.height;
  camera.updateProjectionMatrix();
  applyCamera();
}
addEventListener('resize', fit);
let lastT = performance.now();
function loop() {
  requestAnimationFrame(loop);
  const now = performance.now();
  dampCamera(Math.min(0.1, (now - lastT) / 1000)); lastT = now;
  renderer.render(scene, camera);
}
fit();
setLevel('L5-S1');
$('loading').remove();
loop();
</script>
