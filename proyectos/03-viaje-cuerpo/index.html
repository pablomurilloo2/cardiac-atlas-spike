<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El torrente — un viaje por el cuerpo</title>

<style>
  :root {
    --cream: #F4EFE6; --ink: #241E14; --mut: #8A7E6A; --faint: #A89C88;
    --mono: ui-monospace, Menlo, monospace;
    --serif: Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--cream); color: var(--ink); overflow: hidden;
         font-family: var(--serif); }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%;
           cursor: pointer; }

  .titles { position: fixed; left: 50%; top: 11%; transform: translateX(-50%); z-index: 3;
            text-align: center; pointer-events: none; max-width: 640px; width: 90%; }
  .titles .ey { font: 9.5px var(--mono); letter-spacing: 0.26em; color: var(--faint);
                text-transform: uppercase; margin-bottom: 12px; opacity: 0;
                transition: opacity 1.2s ease; }
  .titles h1 { margin: 0; font: italic 600 46px/1.08 var(--serif); letter-spacing: -0.01em;
               opacity: 0; transition: opacity 1.2s ease, transform 1.2s ease;
               transform: translateY(8px); }
  .titles p { margin: 12px 0 0; font: italic 16px/1.6 var(--serif); color: var(--mut);
              opacity: 0; transition: opacity 1.2s ease 0.25s; }
  .titles.show .ey, .titles.show h1, .titles.show p { opacity: 1; }
  .titles.show h1 { transform: none; }

  .corner { position: fixed; top: 18px; left: 22px; z-index: 3; font: 10px var(--mono);
            letter-spacing: 0.08em; color: var(--faint); }
  .corner a { color: var(--faint); }
  .credit { position: fixed; bottom: 16px; right: 20px; z-index: 3; font: 9px var(--mono);
            color: var(--faint); text-align: right; line-height: 1.6; }
  .hint { position: fixed; bottom: 16px; left: 22px; z-index: 3; font: 10px var(--mono);
          letter-spacing: 0.08em; color: var(--faint); transition: opacity 0.6s ease; }
  .progress { position: fixed; left: 0; right: 0; bottom: 0; height: 2px; z-index: 3;
              background: rgba(36,30,20,0.08); }
  .progress i { display: block; height: 100%; width: 0; background: #A6403D; }
  .loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
             font: 12px var(--mono); color: var(--faint); background: var(--cream); z-index: 9; }
</style>

<canvas id="gl"></canvas>

<div class="titles" id="titles">
  <div class="ey">A journey through the body</div>
  <h1 id="tT"></h1>
  <p id="tB"></p>
</div>
<div class="corner">PROYECTO 03 · <a href="../">← proyectos</a> ·
  <a href="https://x.com/ZentrixHQ/status/2099051720298922284" target="_blank" rel="noreferrer">fuente ↗</a></div>
<div class="hint" id="hint">CLIC PARA PAUSAR · RUEDA PARA ACERCAR</div>
<div class="credit">BodyParts3D © DBCLS · CC BY 4.0<br>1.066 vasos · anatomía de referencia</div>
<div class="progress"><i id="bar"></i></div>
<div class="loading" id="loading">preparando el torrente…</div>

<script type="module">
import * as THREE from '../../vendor/three.module.min.js';
const $ = (id) => document.getElementById(id);

const COLORS = { arterial: '#A6403D', venous: '#47609F', cardiac: '#C69B92', integumentary: '#E7DDD6' };

const renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: true });
renderer.setClearColor(0xF4EFE6, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.005, 12);
const key = new THREE.DirectionalLight(0xFFF6E8, 1.5); key.position.set(3, 4, 3);
const rim = new THREE.DirectionalLight(0xD8E2F4, 0.6); rim.position.set(-4, 1, -3);
scene.add(key, rim, new THREE.HemisphereLight(0xFFFFFF, 0x9A8F7C, 0.85), new THREE.AmbientLight(0xffffff, 0.28));
const root = new THREE.Group(); scene.add(root);

const manifest = await fetch('../../body-subset.json').then((r) => r.json());
$('loading').textContent = 'preparando 1.066 vasos…';
const bin = await fetch('../../body-subset.bin').then((r) => r.arrayBuffer());

const bySystem = { arterial: [], venous: [], cardiac: [], integumentary: [] };
const bbox = new THREE.Box3();
for (const p of manifest.parts) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(bin, p.positions, p.vertexCount * 3), 3));
  g.setAttribute('normal', new THREE.BufferAttribute(new Int16Array(bin, p.normals, p.vertexCount * 3), 3, true));
  g.setIndex(new THREE.BufferAttribute(new Uint32Array(bin, p.indices, p.indexCount), 1));
  g.computeBoundingSphere();
  const skin = p.system === 'integumentary';
  const mat = new THREE.MeshPhysicalMaterial({
    color: new THREE.Color(COLORS[p.system]),
    roughness: skin ? 0.85 : 0.42, metalness: 0.02,
    clearcoat: skin ? 0 : 0.45, clearcoatRoughness: 0.3,
    transparent: true, opacity: 0, depthWrite: false });
  const mesh = new THREE.Mesh(g, mat);
  mesh.renderOrder = skin ? 2 : 1;
  root.add(mesh);
  bySystem[p.system].push(mesh);
  if (!skin) bbox.expandByObject(mesh);
}
const center = bbox.getCenter(new THREE.Vector3());
root.position.sub(center);
const radius = bbox.getSize(new THREE.Vector3()).length() / 2;
const heartC = (() => {
  const c = new THREE.Vector3();
  for (const m of bySystem.cardiac) c.add(m.geometry.boundingSphere.center);
  return c.divideScalar(bySystem.cardiac.length).sub(center);
})();
const topY = bbox.max.y - center.y, botY = bbox.min.y - center.y;

/* ---------- guion: keyframes del viaje (t en segundos) ---------- */
/* op = opacidades destino por sistema; el azimut gira continuo aparte */
const KF = [
  { t: 0,  el: 0.06, dist: 0.34, ty: heartC.y, op: { cardiac: 1, arterial: 0, venous: 0, integumentary: 0 },
    T: 'El corazón', B: '— donde empieza la corriente. Late unas 100.000 veces al día.' },
  { t: 10, el: 0.10, dist: 0.42, ty: heartC.y, op: { cardiac: 1, arterial: 0.25, venous: 0, integumentary: 0 } },
  { t: 14, el: 0.12, dist: 0.85, ty: heartC.y * 0.6, op: { cardiac: 1, arterial: 1, venous: 0, integumentary: 0 },
    T: 'El torrente', B: '— un viaje llevado por una sola corriente: sangre a presión hacia cada rincón.' },
  { t: 24, el: 0.02, dist: 1.05, ty: botY * 0.45, op: { cardiac: 1, arterial: 1, venous: 0, integumentary: 0 } },
  { t: 30, el: -0.04, dist: 0.8, ty: botY * 0.62, op: { cardiac: 0.9, arterial: 1, venous: 0.15, integumentary: 0 } },
  { t: 34, el: 0.02, dist: 0.95, ty: botY * 0.4, op: { cardiac: 0.9, arterial: 0.22, venous: 1, integumentary: 0 },
    T: 'El retorno', B: '— el camino de vuelta: las venas recogen la corriente y la devuelven al corazón.' },
  { t: 46, el: 0.14, dist: 0.6, ty: heartC.y * 0.9, op: { cardiac: 1, arterial: 0.22, venous: 1, integumentary: 0 } },
  { t: 52, el: 0.10, dist: 1.55, ty: heartC.y * 0.25, op: { cardiac: 1, arterial: 1, venous: 1, integumentary: 0.075 },
    T: 'El sistema entero', B: '— unos 100.000 km de vasos dentro de una sola silueta humana.' },
  { t: 68, el: 0.04, dist: 1.7, ty: 0, op: { cardiac: 1, arterial: 1, venous: 1, integumentary: 0.075 } },
  { t: 76, el: 0.06, dist: 1.0, ty: heartC.y * 0.8, op: { cardiac: 1, arterial: 0.5, venous: 0.5, integumentary: 0.04 },
    T: '', B: '' },
  { t: 82, el: 0.06, dist: 0.36, ty: heartC.y, op: { cardiac: 1, arterial: 0, venous: 0, integumentary: 0 } },
];
const DUR = KF[KF.length - 1].t;
const ease = (x) => x * x * (3 - 2 * x);
function sample(t) {
  let i = 0;
  while (i < KF.length - 2 && KF[i + 1].t <= t) i++;
  const a = KF[i], b = KF[i + 1];
  const u = ease(Math.min(1, Math.max(0, (t - a.t) / (b.t - a.t))));
  const L = (x, y) => x + (y - x) * u;
  const op = {};
  for (const k in a.op) op[k] = L(a.op[k], b.op[k]);
  return { el: L(a.el, b.el), dist: L(a.dist, b.dist), ty: L(a.ty, b.ty), op };
}
/* titulo activo segun el ultimo keyframe con texto */
let shownTitle = null;
function updateTitle(t) {
  let cur = null;
  for (const k of KF) if (k.t <= t && k.T !== undefined) cur = k;
  const id = cur ? cur.T : null;
  if (id === shownTitle) return;
  shownTitle = id;
  if (!cur || !cur.T) { $('titles').classList.remove('show'); return; }
  $('tT').textContent = cur.T;
  $('tB').textContent = cur.B;
  $('titles').classList.add('show');
}

/* ---------- reproduccion ---------- */
let playing = true, t = 0, zoomBias = 1, hintFade = 0;
renderer.domElement.addEventListener('click', () => {
  playing = !playing;
  $('hint').textContent = playing ? 'CLIC PARA PAUSAR · RUEDA PARA ACERCAR'
                                  : 'PAUSADO — CLIC PARA SEGUIR · ARRASTRA PARA MIRAR';
});
renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  zoomBias = Math.max(0.45, Math.min(2.2, zoomBias * Math.exp(e.deltaY * 0.0015)));
}, { passive: false });
/* en pausa se puede mirar alrededor */
let dragging = false, lastX = 0, lastY = 0, azOff = 0, elOff = 0;
renderer.domElement.addEventListener('pointerdown', (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
addEventListener('pointerup', () => { dragging = false; });
renderer.domElement.addEventListener('pointermove', (e) => {
  if (!dragging || playing) return;
  azOff -= (e.clientX - lastX) * 0.005;
  elOff = Math.max(-0.9, Math.min(0.9, elOff + (e.clientY - lastY) * 0.004));
  lastX = e.clientX; lastY = e.clientY;
});

function fit() {
  renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', fit);

let lastNow = performance.now();
function loop() {
  requestAnimationFrame(loop);
  const now = performance.now();
  const dtReal = (now - lastNow) / 1000; lastNow = now;
  const dt = Math.min(0.1, dtReal);   // para lerps estables
  if (playing) {
    t = (t + Math.min(1.5, dtReal)) % DUR;   // el guion sigue el reloj real aunque el rAF se acelere o frene
    azOff *= 0.97; elOff *= 0.97;   // vuelve suave al encuadre del guion
  }
  const s = sample(t);
  updateTitle(t);
  $('bar').style.width = (100 * t / DUR) + '%';

  for (const [k, arr] of Object.entries(bySystem)) {
    const target = s.op[k];
    for (const m of arr) m.material.opacity += (target - m.material.opacity) * Math.min(1, dt * 3.5);
  }
  const az = 0.55 + t * 0.085 + azOff;    // giro continuo, nunca se detiene
  const el = s.el + elOff;
  const dist = s.dist * radius * zoomBias;
  const ty = s.ty;
  const ce = Math.cos(el);
  camera.position.set(dist * ce * Math.sin(az), ty + dist * Math.sin(el), dist * ce * Math.cos(az));
  camera.lookAt(0, ty, 0);
  renderer.render(scene, camera);
}
fit();
$('loading').remove();
loop();
</script>
