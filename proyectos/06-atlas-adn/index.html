<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HELIX — The human atlas</title>

<style>
  :root {
    --bg: #0A0C10; --panel: #10131A; --panel2: #161A23; --line: #212734;
    --ink: #E8EAF0; --mut: #8B93A5; --faint: #5A6172; --acc: #FF7A3C;
    --strong: #4ADE9B; --mod: #E8B34A; --weak: #8B93A5;
    --mono: ui-monospace, Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans);
         font-size: 13px; overflow: hidden; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%;
           touch-action: none; cursor: grab; }

  .top { position: fixed; inset: 0 0 auto 0; height: 54px; display: flex; align-items: center;
         gap: 14px; padding: 0 16px; background: rgba(10,12,16,0.9); backdrop-filter: blur(8px);
         border-bottom: 1px solid var(--line); z-index: 6; }
  .logo { display: flex; align-items: baseline; gap: 8px; }
  .logo b { font: 700 15px var(--mono); letter-spacing: 0.22em; }
  .logo span { font-size: 11px; color: var(--faint); }
  .top .spacer { flex: 1; }
  .badge { font: 9.5px var(--mono); letter-spacing: 0.1em; color: var(--faint);
           border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
  .import { background: var(--acc); color: #14090268; color: #221104; border: 0; border-radius: 9px;
            font: 600 12px var(--sans); padding: 8px 14px; cursor: pointer; }
  .import:hover { filter: brightness(1.08); }
  .src { font: 9.5px var(--mono); color: var(--faint); text-decoration: none; }

  .panel { position: fixed; top: 66px; bottom: 64px; background: rgba(16,19,26,0.92);
           backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 14px;
           display: flex; flex-direction: column; overflow: hidden; z-index: 5; }
  .left { left: 12px; width: 252px; }
  .right { right: 12px; width: 300px; }
  .phead { padding: 11px 14px 9px; border-bottom: 1px solid var(--line);
           font: 9.5px var(--mono); letter-spacing: 0.16em; color: var(--mut); }
  .scroll { flex: 1; overflow-y: auto; padding: 6px 8px 12px; }
  .cat { font: 9px var(--mono); letter-spacing: 0.14em; color: var(--faint);
         text-transform: uppercase; padding: 10px 8px 4px; }
  .trait { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 9px;
           cursor: pointer; color: var(--mut); font-size: 12px; }
  .trait:hover { background: var(--panel2); color: var(--ink); }
  .trait.on { background: #2A1A10; color: #FFB388; }
  .trait .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .trait .gene { margin-left: auto; font: 9.5px var(--mono); color: var(--faint); }

  .right .body { flex: 1; overflow-y: auto; padding: 14px; }
  .right .ey { font: 9px var(--mono); letter-spacing: 0.16em; color: var(--faint);
               text-transform: uppercase; }
  .right h2 { margin: 3px 0 8px; font: 600 17px/1.25 var(--sans); }
  .kv { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0;
        font-size: 11.5px; border-bottom: 1px solid var(--line); }
  .kv span:first-child { color: var(--faint); flex: none; }
  .kv span:last-child { font-family: var(--mono); font-size: 11px; text-align: right; }
  .interp { font-size: 12px; line-height: 1.55; color: #C9CFDC; margin: 12px 0; }
  .ev { display: inline-flex; align-items: center; gap: 6px; font: 10px var(--mono);
        letter-spacing: 0.06em; border: 1px solid var(--line); border-radius: 999px;
        padding: 4px 10px; margin-bottom: 10px; }
  .ev i { width: 7px; height: 7px; border-radius: 50%; }
  .note { font-size: 10px; line-height: 1.5; color: var(--faint); border-top: 1px solid var(--line);
          padding-top: 10px; margin-top: 12px; }

  .strip { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%);
           display: flex; gap: 18px; align-items: center; background: rgba(16,19,26,0.92);
           backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 12px;
           padding: 9px 18px; z-index: 6; white-space: nowrap; }
  .stat b { font: 600 13px var(--sans); display: block; }
  .stat span { font-size: 9px; color: var(--faint); letter-spacing: 0.06em; }
  .sep { width: 1px; height: 20px; background: var(--line); }
  .loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
             font: 12px var(--mono); color: var(--faint); background: var(--bg); z-index: 20; }
  input[type=file] { display: none; }
</style>

<canvas id="gl"></canvas>

<header class="top">
  <div class="logo"><b>HELIX</b><span>The human atlas</span></div>
  <span class="badge" id="srcBadge">DEMO GENOME</span>
  <div class="spacer"></div>
  <a class="src" href="https://x.com/ZentrixHQ/status/2097979077239914967" target="_blank" rel="noreferrer">fuente ↗</a>
  <button class="import" id="importBtn">Import DNA</button>
  <input type="file" id="file" accept=".txt,.csv,.tsv">
</header>

<aside class="panel left">
  <div class="phead">TRAITS</div>
  <div class="scroll" id="traits"></div>
</aside>

<aside class="panel right">
  <div class="phead">READOUT</div>
  <div class="body" id="detail"></div>
</aside>

<div class="strip">
  <div class="stat"><b id="stRecords">—</b><span>RECORDS</span></div>
  <div class="sep"></div>
  <div class="stat"><b id="stMatched">—</b><span>TRAITS MATCHED</span></div>
  <div class="sep"></div>
  <div class="stat"><b>100%</b><span>IN-BROWSER · NADA SE SUBE</span></div>
</div>
<div class="loading" id="loading">building the body…</div>

<script type="module">
import * as THREE from '../../vendor/three.module.min.js';

const $ = (id) => document.getElementById(id);

/* ============ traits db (SNPs conocidos, interpretacion honesta) ============ */
const REGIONS = {
  eyes:   { match: /eyeball/i, color: '#5A8DFF' },
  hair:   { match: /^hair of head$/i, color: '#B07A4A' },
  skin:   { match: /^skin$/i, color: '#E0A882' },
  liver:  { match: /liver/i, color: '#C4633C' },
  gut:    { match: /(^stomach$|colon$|duodenum|jejunum|ileum)/i, color: '#D89A4A' },
  kidney: { match: /^(left|right) kidney$/i, color: '#8A5A6B' },
  brain:  { match: /(frontal lobe|parietal lobe|temporal lobe|occipital lobe|cerebell|midbrain|pons|medulla oblongata)/i, color: '#C86FA8' },
  muscle: { match: /(biceps femoris|gastrocnemius|vastus|rectus femoris|deltoid)/i, color: '#B0483F' },
  heart:  { match: /^heart$|ventricle of heart|atrium/i, color: '#B03A46' },
};
const TRAITS = [
  { id: 'eyecolor', cat: 'Pigmentation', title: 'Eye pigmentation', gene: 'HERC2 / OCA2',
    snps: ['rs12913832'], region: 'eyes', evidence: 'strong',
    interp: { GG: 'GG — the common European variant that shuts down OCA2 expression in the iris: usually blue or gray eyes.',
              AG: 'AG — intermediate melanin production; usually green, hazel or light brown.',
              AA: 'AA — full OCA2 expression; usually brown eyes.' },
    evNote: 'One of the most replicated genotype-phenotype links in humans.' },
  { id: 'redhair', cat: 'Pigmentation', title: 'Red hair signal', gene: 'MC1R',
    snps: ['rs1805007'], region: 'hair', evidence: 'strong',
    interp: { CC: 'CC — no R151C variant; red hair unlikely through this position.',
              CT: 'CT — carrier of one R151C copy; red or auburn tones possible, more freckling.',
              TT: 'TT — two copies; red hair very likely, high UV sensitivity.' },
    evNote: 'MC1R loss-of-function is the main red-hair pathway.' },
  { id: 'skintone', cat: 'Pigmentation', title: 'Skin melanin (TYR)', gene: 'TYR',
    snps: ['rs1042602'], region: 'skin', evidence: 'moderate',
    interp: { CC: 'CC — tyrosinase unaffected at this site.',
              CA: 'CA — one copy of the S192Y variant, associated with lighter skin and freckles in Europeans.',
              AA: 'AA — both copies; stronger association with light skin.' },
    evNote: 'One of several loci; skin tone is highly polygenic.' },
  { id: 'lactase', cat: 'Metabolism', title: 'Lactase persistence', gene: 'MCM6 → LCT',
    snps: ['rs4988235'], region: 'gut', evidence: 'strong',
    interp: { GG: 'GG — lactase typically switches off after childhood: adult lactose intolerance likely.',
              AG: 'AG — one persistence allele; usually enough enzyme to digest dairy.',
              AA: 'AA — lactase keeps producing in adulthood; dairy digestion expected.' },
    evNote: 'Classic European persistence allele upstream of LCT.' },
  { id: 'caffeine', cat: 'Metabolism', title: 'Caffeine clearance', gene: 'CYP1A2',
    snps: ['rs762551'], region: 'liver', evidence: 'moderate',
    interp: { AA: 'AA — "fast" hepatic caffeine metabolism; effects fade sooner.',
              AC: 'AC — intermediate clearance.',
              CC: 'CC — slower clearance; caffeine lingers, late coffee hits harder.' },
    evNote: 'Association is replicated but lifestyle strongly modulates it.' },
  { id: 'alcohol', cat: 'Metabolism', title: 'Alcohol flush', gene: 'ALDH2',
    snps: ['rs671'], region: 'liver', evidence: 'strong',
    interp: { GG: 'GG — normal aldehyde clearance; no flush reaction expected.',
              AG: 'AG — one inactive copy: facial flushing and acetaldehyde buildup with alcohol.',
              AA: 'AA — both copies inactive; strong flush, alcohol poorly tolerated.' },
    evNote: 'The East-Asian flush variant; near-deterministic.' },
  { id: 'folate', cat: 'Metabolism', title: 'Folate cycle (MTHFR)', gene: 'MTHFR',
    snps: ['rs1801133'], region: 'liver', evidence: 'moderate',
    interp: { GG: 'GG — full enzyme activity (C677).',
              AG: 'AG — ~65% activity; usually irrelevant with normal folate intake.',
              AA: 'AA — ~30% activity (677TT); homocysteine can run higher when folate is low.' },
    evNote: 'Real biochemistry, but health impact depends on diet; heavily over-sold by wellness tests.' },
  { id: 'apoe', cat: 'Neuro', title: 'APOE isoform', gene: 'APOE (2 SNPs)',
    snps: ['rs429358', 'rs7412'], region: 'brain', evidence: 'strong',
    combo: true,
    evNote: 'Association with late-onset Alzheimer risk is real and replicated — but this is a risk factor, not a diagnosis, and most carriers never develop the disease.' },
  { id: 'comt', cat: 'Neuro', title: 'COMT Val158Met', gene: 'COMT',
    snps: ['rs4680'], region: 'brain', evidence: 'weak',
    interp: { GG: 'GG — Val/Val: faster prefrontal dopamine breakdown.',
              AG: 'AG — intermediate activity.',
              AA: 'AA — Met/Met: slower breakdown; small cognitive-style associations, inconsistently replicated.' },
    evNote: '"Warrior/worrier" framing oversells small, noisy effects.' },
  { id: 'earwax', cat: 'Traits', title: 'Earwax & body odor', gene: 'ABCC11',
    snps: ['rs17822931'], region: 'skin', evidence: 'strong',
    interp: { CC: 'CC — wet earwax, typical apocrine odor.',
              CT: 'CT — wet earwax (dominant).',
              TT: 'TT — dry earwax and markedly less underarm odor.' },
    evNote: 'Single-gene trait, essentially Mendelian.' },
  { id: 'muscle', cat: 'Traits', title: 'Fast-twitch fibers', gene: 'ACTN3',
    snps: ['rs1815739'], region: 'muscle', evidence: 'moderate',
    interp: { CC: 'CC — alpha-actinin-3 present in fast fibers; common in sprint athletes.',
              CT: 'CT — one working copy.',
              TT: 'TT — the "sprinter protein" absent; slight tilt toward endurance profiles.' },
    evNote: 'Real protein difference; performance effect is modest.' },
  { id: 'fto', cat: 'Traits', title: 'FTO satiety signal', gene: 'FTO',
    snps: ['rs9939609'], region: 'gut', evidence: 'moderate',
    interp: { TT: 'TT — reference genotype.',
              AT: 'AT — one risk allele: on average ~1 kg higher body mass, mostly via appetite.',
              AA: 'AA — two copies; the association is real but small next to habits and environment.' },
    evNote: 'The most replicated BMI locus — and still a tiny effect.' },
];
const APOE = {
  'CC/CC': ['ε4/ε4', 'Two ε4 copies — the higher-risk isoform combination. Statistical risk factor only; environment and other genes matter enormously.'],
  'CT/CC': ['ε3/ε4', 'One ε4 copy — moderately elevated statistical association.'],
  'TT/CC': ['ε3/ε3', 'The most common neutral isoform pair.'],
  'TT/CT': ['ε2/ε3', 'One ε2 copy — statistically protective direction.'],
  'TT/TT': ['ε2/ε2', 'Rare; mildly protective direction for Alzheimer, with its own lipid quirks.'],
  'CT/CT': ['ε2/ε4 (or ambiguous)', 'Mixed isoforms — chip data cannot always phase this pair.'],
};

/* demo persona (labeled DEMO — replaced by Import DNA) */
let genome = new Map(Object.entries({
  rs12913832: 'AG', rs1805007: 'CT', rs1042602: 'CA', rs4988235: 'AG',
  rs762551: 'CC', rs671: 'GG', rs1801133: 'AG', rs429358: 'TT', rs7412: 'CC',
  rs4680: 'AG', rs17822931: 'CC', rs1815739: 'CT', rs9939609: 'AT',
}));
let recordCount = 660138, sourceName = 'DEMO GENOME';

/* ============ 3D body ============ */
const manifest = await fetch('../../anatomy-full.json').then((r) => r.json());
const bin = await fetch('../../anatomy-full.bin').then((r) => r.arrayBuffer());

const renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: true, alpha: false });
renderer.setClearColor(0x0A0C10, 1);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 20);
scene.add(new THREE.HemisphereLight(0x9FB0CC, 0x0E1014, 0.9), new THREE.AmbientLight(0xffffff, 0.32));
const key = new THREE.DirectionalLight(0xE8DFD0, 1.2); key.position.set(2.5, 3.5, 2.5); scene.add(key);
const rim = new THREE.DirectionalLight(0xFF7A3C, 0.35); rim.position.set(-3, 1, -2.5); scene.add(rim);

const root = new THREE.Group(); scene.add(root);
const regionMeshes = new Map(Object.keys(REGIONS).map((k) => [k, []]));
let skinMesh = null;
const bbox = new THREE.Box3();

function buildGeo(p) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(bin, p.positions, p.vertexCount * 3), 3));
  g.setAttribute('normal', new THREE.BufferAttribute(new Int16Array(bin, p.normals, p.vertexCount * 3), 3, true));
  g.setIndex(new THREE.BufferAttribute(new Uint32Array(bin, p.indices, p.indexCount), 1));
  return g;
}
for (const p of manifest.parts) {
  const isSkin = /^skin$/i.test(p.name);
  let hit = null;
  for (const [k, r] of Object.entries(REGIONS)) if (r.match.test(p.name)) { hit = k; break; }
  if (!isSkin && !hit) continue;
  const g = buildGeo(p);
  g.computeBoundingSphere();
  if (isSkin) {
    const m = new THREE.Mesh(g, new THREE.MeshPhysicalMaterial({
      color: new THREE.Color('#8FA6CC'), transparent: true, opacity: 0.07,
      roughness: 0.7, metalness: 0, depthWrite: false, side: THREE.DoubleSide }));
    m.renderOrder = 2;
    skinMesh = m; root.add(m);
  }
  if (hit) {
    const col = new THREE.Color(REGIONS[hit].color);
    const m = new THREE.Mesh(g, new THREE.MeshPhysicalMaterial({
      color: col, transparent: true, opacity: 0.16, roughness: 0.5, metalness: 0.05,
      emissive: col, emissiveIntensity: 0 }));
    m.userData.baseColor = col;
    regionMeshes.get(hit).push(m); root.add(m);
  }
  g.computeBoundingBox();
  bbox.union(g.boundingBox);
}
const center = bbox.getCenter(new THREE.Vector3());
root.position.sub(center);
const size = bbox.getSize(new THREE.Vector3());
const radius = size.length() / 2;
const regionCenter = {};
for (const [k, arr] of regionMeshes) {
  if (!arr.length) continue;
  const c = new THREE.Vector3();
  for (const m of arr) c.add(m.geometry.boundingSphere.center);
  regionCenter[k] = c.divideScalar(arr.length).sub(center);
}

/* ============ evaluation ============ */
function genotypeOf(rsid) {
  let g = genome.get(rsid);
  if (!g) return null;
  g = g.toUpperCase().replace(/[^ACGT]/g, '');
  if (g.length === 1) g = g + g;
  return g.split('').sort().join('');
}
function evalTrait(t) {
  if (t.combo) {
    const a = genotypeOf('rs429358'), b = genotypeOf('rs7412');
    if (!a || !b) return { geno: '—', text: 'One or both APOE positions are not on this chip.' , found: false };
    const key = `${a}/${b}`;
    const hit = APOE[key] || ['?', 'Unusual combination for chip data.'];
    return { geno: `${key} → ${hit[0]}`, text: hit[1], found: true };
  }
  const g = genotypeOf(t.snps[0]);
  if (!g) return { geno: '—', text: 'This position is not present in the current file.', found: false };
  const norm = Object.keys(t.interp).find((k) => k.split('').sort().join('') === g);
  return { geno: g, text: norm ? t.interp[norm] : `Genotype ${g} — no annotation for this combination.`, found: !!norm };
}

/* ============ UI ============ */
const EV = { strong: ['var(--strong)', 'replicated association'],
             moderate: ['var(--mod)', 'moderate evidence'],
             weak: ['var(--weak)', 'weak / contested signal'] };
let current = null;

function buildList() {
  const wrap = $('traits'); wrap.innerHTML = '';
  let matched = 0;
  const cats = [...new Set(TRAITS.map((t) => t.cat))];
  for (const c of cats) {
    const h = document.createElement('div'); h.className = 'cat'; h.textContent = c;
    wrap.appendChild(h);
    for (const t of TRAITS.filter((t) => t.cat === c)) {
      const r = evalTrait(t);
      if (r.found) matched++;
      const el = document.createElement('div');
      el.className = 'trait'; el.dataset.id = t.id;
      el.innerHTML = `<span class="dot" style="background:${EV[t.evidence][0]}"></span>
        ${t.title}<span class="gene">${t.gene.split(' ')[0]}</span>`;
      el.addEventListener('click', () => selectTrait(t.id));
      wrap.appendChild(el);
    }
  }
  $('stMatched').textContent = `${matched} / ${TRAITS.length}`;
  $('stRecords').textContent = recordCount.toLocaleString('en-US');
  $('srcBadge').textContent = sourceName;
}
function selectTrait(id) {
  current = id;
  const t = TRAITS.find((t) => t.id === id);
  document.querySelectorAll('.trait').forEach((e) => e.classList.toggle('on', e.dataset.id === id));
  const r = evalTrait(t);
  $('detail').innerHTML = `
    <div class="ey">${t.cat}</div>
    <h2>${t.title}</h2>
    <div class="ev"><i style="background:${EV[t.evidence][0]}"></i>${EV[t.evidence][1]}</div>
    <div class="kv"><span>Gene</span><span>${t.gene}</span></div>
    <div class="kv"><span>Position${t.snps.length > 1 ? 's' : ''}</span><span>${t.snps.join(' · ')}</span></div>
    <div class="kv"><span>Your genotype</span><span>${r.geno}</span></div>
    <div class="interp">${r.text}</div>
    <div class="note">${t.evNote} No percentages, no paywall — the read is only as deep as the
      evidence allows. Nothing here is medical advice.</div>`;
  /* highlight region */
  for (const [k, arr] of regionMeshes) {
    const on = k === t.region;
    for (const m of arr) {
      m.material.opacity = on ? 0.85 : 0.16;
      m.material.emissiveIntensity = on ? 0.35 : 0;
      m.material.depthWrite = on;
    }
  }
  const c = regionCenter[t.region];
  if (c) {
    orbit.target.copy(c);
    const arr = regionMeshes.get(t.region);
    let r2 = 0.08;
    for (const m of arr) r2 = Math.max(r2, m.geometry.boundingSphere.radius);
    orbit.dist = Math.max(radius * 0.5, r2 * 6);
  }
}

/* ============ import (todo local) ============ */
$('importBtn').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', async () => {
  const f = $('file').files[0];
  if (!f) return;
  const text = await f.text();
  const map = new Map();
  let n = 0;
  for (const line of text.split(/\r?\n/)) {
    if (!line || line[0] === '#') continue;
    const cols = line.split(/[\t,]/);
    if (cols.length < 4 || !/^rs\d+$/.test(cols[0])) continue;
    n++;
    const geno = cols.length >= 5 ? cols[3] + cols[4] : cols[3];
    map.set(cols[0], geno);
  }
  if (!n) { alert('No pude leer posiciones rs# en ese archivo (formato 23andMe/Ancestry).'); return; }
  genome = map; recordCount = n; sourceName = f.name.toUpperCase().slice(0, 22);
  buildList();
  if (current) selectTrait(current);
});

/* ============ camera ============ */
const dist0 = radius * 3.6;
const orbit = { az: 0, el: 0.04, dist: dist0, target: new THREE.Vector3() };
const cur = { az: 0, el: 0.04, dist: dist0, target: new THREE.Vector3() };
const cv = renderer.domElement;
let dragging = false, lastX = 0, lastY = 0;
cv.addEventListener('pointerdown', (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY;
  try { cv.setPointerCapture(e.pointerId); } catch {} });
cv.addEventListener('pointerup', (e) => { dragging = false; try { cv.releasePointerCapture(e.pointerId); } catch {} });
cv.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  orbit.az -= (e.clientX - lastX) * 0.005;
  orbit.el = Math.max(-1.25, Math.min(1.25, orbit.el + (e.clientY - lastY) * 0.005));
  lastX = e.clientX; lastY = e.clientY;
});
cv.addEventListener('wheel', (e) => {
  e.preventDefault();
  orbit.dist = Math.max(radius * 0.15, Math.min(radius * 5, orbit.dist * Math.exp(e.deltaY * 0.0016)));
}, { passive: false });

function fit() {
  renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', fit);
let lastT = performance.now();
function loop() {
  requestAnimationFrame(loop);
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  const k = 1 - Math.exp(-dt * 8);
  cur.az += (orbit.az - cur.az) * k; cur.el += (orbit.el - cur.el) * k;
  cur.dist += (orbit.dist - cur.dist) * k; cur.target.lerp(orbit.target, k);
  const ce = Math.cos(cur.el);
  camera.position.set(
    cur.target.x + cur.dist * ce * Math.sin(cur.az),
    cur.target.y + cur.dist * Math.sin(cur.el),
    cur.target.z + cur.dist * ce * Math.cos(cur.az));
  camera.lookAt(cur.target);
  renderer.render(scene, camera);
}
fit();
buildList();
selectTrait('eyecolor');
$('loading').remove();
loop();
</script>
